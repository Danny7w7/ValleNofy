<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10272b" />
    <meta name="description" content="Tu próximo flechazo suena a vallenato. Elige tus cinco favoritas, escucha, desliza y arma tu propia parranda con ValleNofy." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        const theme = localStorage.getItem('vallenofy-theme') === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#10272b' : '#fff9ec'
      } catch { /* Dark mode is the default when browser storage is unavailable. */ }
    </script>
    <title>ValleNofy · Que siga la parranda</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
